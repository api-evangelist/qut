  - date: '2026-09-01'
    rating: 4
    summary: >-
      Re-profiled under the API Evangelist university pipeline, with operator attribution settled by
      IP ownership and TLS subject rather than by hostname. The result raised the assessment: QUT
      operates THREE machine-readable surfaces on its own infrastructure, all inside APNIC
      allocation QUT-AU / ORG-QUOT1-AP (AS7575), none CNAMEd to a managed platform, each behind a
      DigiCert OV certificate issued to O=QUEENSLAND UNIVERSITY OF TECHNOLOGY. Two of the three
      publish complete machine-readable contracts of their own.
      (1) QUT ePrints OAI-PMH 2.0 at eprints.qut.edu.au/cgi/oai2 — public, unauthenticated, all six
      verbs, advertising oai_dc, oai_bibl, oai_openaire and uketd_dc. (2) A SELF-HOSTED Shibboleth
      SAML 2.0 identity provider at idp.qut.edu.au, publishing per-entity metadata that dereferences
      from its own entityID and asserting shibmd:Scope qut.edu.au — unlike the AAF Rapid tenancies
      found at Monash and Melbourne, this one is genuinely QUT's. (3) A Keycloak OpenID Connect
      authorization server at esoe.qut.edu.au/auth/realms/qut, publishing full OIDC discovery, an
      RFC 8414 document, a JWKS and a SAML descriptor, with dynamic client registration, PAR, CIBA,
      device code and certificate-bound tokens, brokering interactive login to Microsoft Entra ID.
      New negative findings recorded rather than smoothed over: the EPrints REST index is open while
      every record behind it 401s; the authorization server has no public route to a credential;
      docs.eres.qut.edu.au — the MCP target of QUT eResearch's public agent plugin marketplace —
      resolves publicly to the RFC 1918 address 172.30.92.51 and is unreachable from outside QUT;
      webwork.qut.edu.au is registered in the AAF aggregate but returns NXDOMAIN; api.qut.edu.au
      resolves into QUT space and answers a bare 404 on every path probed; and www.qut.edu.au sits
      behind a Cloudflare managed challenge that 403s even a request for robots.txt.
      Vendor and registry relationships recorded, their contracts deliberately not saved: Ex Libris
      Primo VE (61QUT_INST:QUT), Instructure Canvas (CNAME to qut-prod-vanity.instructure.com),
      ARDC Research Data Australia (926 registry objects), DataCite (ARDCX.QUT1, 535 DOIs, plus RAiD
      client UUAG.IXKMSM), Crossref (member 3230), ROR (03pnv4752) and AAF membership.
      No endpoints fabricated. Every OpenAPI in this repository is derived from a document QUT
      actually serves.
