source: >-
  Live probes on 2026-09-01 of https://idp.qut.edu.au/idp/shibboleth (200),
  https://esoe.qut.edu.au/auth/realms/qut/protocol/saml/descriptor (200),
  https://esoe.qut.edu.au/auth/realms/qut/.well-known/openid-configuration (200),
  https://eprints.qut.edu.au/cgi/oai2?verb=Identify (200),
  ?verb=ListMetadataFormats (200) and ?verb=ListSets (200); the AAF production metadata aggregate
  https://md.aaf.edu.au/aaf-metadata.xml (200); https://api.datacite.org/clients/ardcx.qut1 (200),
  https://api.datacite.org/clients/uuag.ixkmsm (200), https://api.crossref.org/members/3230 (200),
  https://api.ror.org/v2/organizations/03pnv4752 (200); and DNS + APNIC whois + TLS inspection of
