description: >-
  Conformance against the Kin Score `education` regime standards list — scim, lti, oneroster,
  ed-fi, caliper, qti, oai-pmh, shibboleth, saml, orcid, datacite, crossref. Reward-only: a
  standard is recorded conformant for QUT only where an INSTITUTION-OPERATED surface demonstrates
  it, with a fetchable location naming the evidence. Standards reached only through a vendor
  platform running under a QUT hostname are listed separately as tenant-operated, because that
  conformance belongs to the platform's engineering, not to QUT's.

  QUT is unusual in this cohort in that its three strongest conformances — oai-pmh, shibboleth and
  saml — all rest on hosts inside QUT's own APNIC allocation (AS7575), with no CNAME to a managed
  platform and with QUT-procured DigiCert OV certificates. This is not a repository of tenancy
  claims; it is an institution running the protocol itself.

conforms:
  - standard: oai-pmh
    name: Open Archives Initiative Protocol for Metadata Harvesting 2.0
    status: conformant
    x-operator: institution
    confidence: high
    evidence:
      url: https://eprints.qut.edu.au/cgi/oai2?verb=Identify
      status: 200
      locations:
        - 'OAI-PMH/Identify/protocolVersion = 2.0'
        - 'OAI-PMH/Identify/repositoryName = QUT ePrints'
        - 'OAI-PMH/Identify/baseURL = https://eprints.qut.edu.au/cgi/oai2'
        - 'OAI-PMH/Identify/adminEmail = eprints@qut.edu.au'
        - 'OAI-PMH/Identify/granularity = YYYY-MM-DDThh:mm:ssZ'
        - 'OAI-PMH/Identify/deletedRecord = persistent'
        - 'OAI-PMH/Identify/description/oai-identifier/repositoryIdentifier = eprints.qut.edu.au'
      corroboration:
        list_metadata_formats:
          url: https://eprints.qut.edu.au/cgi/oai2?verb=ListMetadataFormats
          status: 200
          formats: [oai_dc, oai_bibl, oai_openaire, uketd_dc]
        list_sets:
          url: https://eprints.qut.edu.au/cgi/oai2?verb=ListSets
          status: 200
          note: >-
            Twelve or more setSpec values returned; QUT hex-encodes the underlying EPrints filter,
            e.g. 74797065733D61727469636C65 is `types=article`.
        resolved_ip: 131.181.196.14
        ip_owner: QUT-AU / ORG-QUOT1-AP — Queensland University of Technology (APNIC), AS7575
        tls_subject: C=AU, O=QUEENSLAND UNIVERSITY OF TECHNOLOGY, CN=eprints.qut.edu.au
    contract: openapi/qut-eprints-oai-pmh-openapi.yml
    note: >-
      Complete OAI-PMH 2.0 implementation, public and unauthenticated, on QUT's own address space,
      advertising the OpenAIRE profile (oai_openaire) alongside Dublin Core. It also carries an
      explicit machine-readable reuse statement in the Identify description block.

  - standard: shibboleth
    name: Shibboleth Identity Provider
    status: conformant
    x-operator: institution
    confidence: high
    evidence:
      url: https://idp.qut.edu.au/idp/shibboleth
      status: 200
      entity: https://idp.qut.edu.au/idp/shibboleth
      locations:
        - 'EntityDescriptor[@entityID="https://idp.qut.edu.au/idp/shibboleth"]/IDPSSODescriptor'
        - 'IDPSSODescriptor/@protocolSupportEnumeration contains urn:mace:shibboleth:1.0'
        - 'IDPSSODescriptor/Extensions/shibmd:Scope = qut.edu.au'
        - 'SingleSignOnService/@Binding = urn:mace:shibboleth:1.0:profiles:AuthnRequest'
      corroboration:
        federation_aggregate:
          url: https://md.aaf.edu.au/aaf-metadata.xml
          status: 200
          organization_display_name: Queensland University of Technology
        resolved_ip: 131.181.196.172
        cname: none
        ip_owner: QUT-AU / ORG-QUOT1-AP — Queensland University of Technology (APNIC), AS7575
        tls_subject: C=AU, O=QUEENSLAND UNIVERSITY OF TECHNOLOGY, CN=idp.qut.edu.au
        tls_issuer: DigiCert Global G2 TLS RSA SHA256 2020 CA1
    contract: identity-federation/qut-idp-saml-metadata.xml
    note: >-
      QUT self-publishes per-entity metadata that dereferences from its own entityID — which the
      AAF-managed IdPs in this cohort do not do — and serves it from its own network. The
      shibmd:Scope element asserts authority over the qut.edu.au namespace.

  - standard: saml
    name: SAML 2.0
    status: conformant
    x-operator: institution
    confidence: high
    evidence:
      url: https://esoe.qut.edu.au/auth/realms/qut/protocol/saml/descriptor
      status: 200
      entity: https://esoe.qut.edu.au/auth/realms/qut
      locations:
        - 'md:EntityDescriptor[@entityID="https://esoe.qut.edu.au/auth/realms/qut"]/md:IDPSSODescriptor'
        - 'xmlns:md = urn:oasis:names:tc:SAML:2.0:metadata'
      corroboration:
        second_independent_idp:
          url: https://idp.qut.edu.au/idp/shibboleth
          status: 200
          locations:
            - 'IDPSSODescriptor/@protocolSupportEnumeration contains urn:oasis:names:tc:SAML:2.0:protocol'
            - 'SingleSignOnService/@Binding = urn:oasis:names:tc:SAML:2.0:bindings:HTTP-Redirect'
            - 'SingleSignOnService/@Binding = urn:oasis:names:tc:SAML:2.0:bindings:HTTP-POST'
            - 'SingleSignOnService/@Binding = urn:oasis:names:tc:SAML:2.0:bindings:HTTP-POST-SimpleSign'
        service_providers_in_aaf:
          - https://esoe.qut.edu.au/shibboleth
          - https://webwork.qut.edu.au/shibboleth
        resolved_ip: 131.181.118.129
        ip_owner: QUT-AU / ORG-QUOT1-AP — Queensland University of Technology (APNIC), AS7575
    contract: identity-federation/qut-esoe-saml-descriptor.xml
    note: >-
      Two independent SAML 2.0 identity providers on QUT-owned infrastructure, plus QUT-operated
      service providers registered in the national federation. This is the strongest evidence in
      the profile.

  - standard: datacite
    name: DataCite DOI registration
    status: conformant
    x-operator: registry
    confidence: high
    evidence:
      url: https://api.datacite.org/clients/ardcx.qut1
      status: 200
      locations:
        - 'data.id = ardcx.qut1'
        - 'data.attributes.symbol = ARDCX.QUT1'
        - 'data.attributes.name = Queensland University of Technology'
        - 'data.attributes.clientType = repository'
        - 'data.attributes.year = 2020'
      corroboration:
        doi_count:
          url: https://api.datacite.org/dois?client-id=ardcx.qut1
          status: 200
          meta_total: 535
        second_client:
          url: https://api.datacite.org/clients/uuag.ixkmsm
          status: 200
          id: uuag.ixkmsm
          name: Queensland University of Technology - Research Infrastructure
          clientType: raidRegistry
          year: 2024
          note: >-
            A RAiD (Research Activity Identifier, ISO 23527) registry client, not a DOI repository.
            QUT eResearch authored the original RAiD API implementation, so this registration is
            consistent with a long-standing institutional role in that identifier system.
    note: >-
      This is a MEMBERSHIP, not a contract. QUT registers DOIs through the ARDC DataCite
      consortium. api.datacite.org is DataCite's own API and is deliberately NOT saved here.

  - standard: crossref
    name: Crossref membership
    status: conformant
    x-operator: registry
    confidence: high
    evidence:
      url: https://api.crossref.org/members/3230
      status: 200
      locations:
        - 'message.id = 3230'
        - 'message.primary-name = Queensland University of Technology'
    note: >-
      Membership evidenced by member id, recorded as a fact about QUT. Crossref's own API is not
      saved as QUT's contract.

  - standard: orcid
    name: ORCID
    status: partial
    x-operator: registry
    confidence: low
    evidence:
      url: https://pub.orcid.org/v3.0/expanded-search/?q=affiliation-org-name:%22Queensland%20University%20of%20Technology%22
      status: 200
      locations:
        - 'num-found = 8585'
    note: >-
      Deliberately recorded as PARTIAL, not conformant. 8,585 ORCID records carry a QUT affiliation,
      which evidences that QUT researchers use ORCID — it does NOT evidence that QUT operates an
      ORCID member integration, and no QUT-published surface asserting ORCID membership was found.
      Padding this to `conformant` on an affiliation count is exactly the inference this pipeline
      exists to refuse.

not_conformant:
  - standard: scim
    note: No SCIM 2.0 endpoint found. /scim/v2 probes against esoe.qut.edu.au were not exposed publicly.
  - standard: lti
    note: >-
      QUT runs Canvas at canvas.qut.edu.au, and Canvas is an LTI 1.3 platform — but that
      conformance is Instructure's, on a tenancy QUT buys. Not credited to the institution.
  - standard: oneroster
    note: No IMS OneRoster surface found.
  - standard: ed-fi
    note: Ed-Fi is a US K-12 data standard and does not apply to an Australian university.
  - standard: caliper
    note: No Caliper Analytics endpoint found.
  - standard: qti
    note: No QTI surface found.

tenant_operated:
  - standard: lti
    platform: Instructure Canvas
    host: canvas.qut.edu.au
    status: 200
    x-operator: tenant
    cname_target: qut-prod-vanity.instructure.com
    resolved_ip: [13.33.67.61, 13.33.67.118]
    ip_owner: Amazon CloudFront
    note: >-
      LTI conformance belongs to Instructure. QUT is the customer. Recorded because a hostname-only
      verdict reads canvas.qut.edu.au as institution-operated — the CNAME to
      qut-prod-vanity.instructure.com is what settles it.
  - standard: primo-alma
    platform: Ex Libris Primo VE / Alma
    host: qut.primo.exlibrisgroup.com
    view_id: 61QUT_INST:QUT
    status: 200
    x-operator: tenant
    note: >-
      Ex Libris publishes developer APIs for Alma and Primo. QUT publishes no keys, no developer
      documentation and no open route to them, and the contract is Ex Libris's regardless.
