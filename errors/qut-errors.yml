    convention: OAI-PMH 2.0 protocol errors
    transport_status_on_error: 200
    note: >-
      A protocol failure is returned as HTTP 200 carrying an <error code="..."> element inside the
      OAI-PMH envelope. An agent that reads only the status code will treat every malformed request
      as a success. This is the OAI-PMH specification's behaviour, not a QUT defect, but it is the
      single most important thing an integrator needs to know about this endpoint.
