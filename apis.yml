x-coverage:
  state: covered
  reason: covered
  detail: >-
    Three institution-operated machine surfaces were confirmed live and confirmed QUT-owned by IP
    and certificate rather than by hostname: eprints.qut.edu.au (131.181.196.14),
    idp.qut.edu.au (131.181.196.172) and esoe.qut.edu.au (131.181.118.129), all inside APNIC
    allocation QUT-AU / ORG-QUOT1-AP, origin AS7575 "Queensland University of Technology", none
    with a CNAME to a managed platform, each behind a DigiCert OV certificate issued to
    O=QUEENSLAND UNIVERSITY OF TECHNOLOGY. That check is the one that changed the answer for Monash
    and Melbourne, whose institution-branded IdPs turned out to be AAF Rapid tenancies on Amazon
    address space; QUT passes it. Two of the three publish complete machine-readable contracts of
    their own — an OAI-PMH 2.0 Identify response and a full OpenID Connect / RFC 8414 discovery
    document — so unlike most of this cohort, the OpenAPIs in this repository are derived from
    documents QUT actually serves, not invented around a link.
    QUT publishes no OpenAPI, no developer portal, no API keys and no self-service registration.
    The authorization server is standards-complete and there is no public path to a credential for
    it; the EPrints REST index is open while every record behind it returns 401. Both are recorded
    as observed rather than smoothed over.
    Five relationships are real institutional facts on platforms QUT does not run and their vendor
    contracts are deliberately not saved: Ex Libris Primo VE, Instructure Canvas, ARDC Research Data
    Australia (926 registry objects under the QUT group), DataCite (ARDCX.QUT1, 535 DOIs, plus RAiD
    client UUAG.IXKMSM) and Crossref (member 3230). The AAF federation membership and the ROR
    registration are recorded for the same reason and must never be deleted as shared hosts.
    Two negative findings worth carrying. First, docs.eres.qut.edu.au — the target of the MCP server
    QUT eResearch publishes in its public agent plugin marketplace — resolves on every public
    resolver to 172.30.92.51, an RFC 1918 private address, so the published plugin cannot reach its
    source from outside QUT. Second, the principal web estate at www.qut.edu.au sits behind a
    Cloudflare managed challenge (cf-mitigated: challenge) that returns 403 to every non-browser
    client including a request for robots.txt, which makes QUT's own crawl directives unreadable to
    the crawlers they address. That is live-but-unreadable — a limit on our probe, not a gap in QUT.
    One CNAME tenancy was found that the pre-computed DNS pass had reported as none:
    canvas.qut.edu.au is on QUT's own registrable domain but CNAMEs to
    qut-prod-vanity.instructure.com and terminates on Amazon CloudFront (13.33.67.61,
    13.33.67.118). A hostname-only verdict credits that surface to QUT; it is Instructure's.
    No open data portal exists (data.qut.edu.au NXDOMAIN), no developer portal exists
    (developer.qut.edu.au NXDOMAIN), and no course or timetable API was found
    (timetable.qut.edu.au NXDOMAIN). api.qut.edu.au does resolve into QUT's own address space and
    answers with a bare text/plain 404 on every path probed, including /openapi.json, /swagger.json,
    /docs, /v1, /api, /health and /graphql — an API gateway with no publicly routed surface.
