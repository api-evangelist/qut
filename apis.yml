apis:
  - name: QUT ePrints OAI-PMH 2.0
    description: >-
      Public, unauthenticated OAI-PMH 2.0 metadata harvesting interface for QUT's institutional
      research repository. All six verbs served. Advertises oai_dc, oai_bibl, oai_openaire and
      uketd_dc. Identify names the repository "QUT ePrints", adminEmail eprints@qut.edu.au,
      repositoryIdentifier eprints.qut.edu.au.
    x-operator: institution
    x-operator-basis: >-
      eprints.qut.edu.au resolves to 131.181.196.14 with no CNAME; APNIC netname QUT-AU, org
      ORG-QUOT1-AP "Queensland University of Technology", origin AS7575; TLS subject
      O=QUEENSLAND UNIVERSITY OF TECHNOLOGY, CN=eprints.qut.edu.au. Software is open-source GNU
      EPrints, self-hosted — not a vendor tenancy.
    humanURL: https://www.library.qut.edu.au/about/collections/qut-eprints/
    baseURL: https://eprints.qut.edu.au/cgi/oai2
    properties:
      - type: OpenAPI
        url: openapi/qut-eprints-oai-pmh-openapi.yml
      - type: JSONSchema
        url: json-schema/qut-oai-pmh-identify-schema.json
      - type: Documentation
        url: https://www.library.qut.edu.au/about/collections/qut-eprints/
    tags:
      - OAI-PMH
      - Research Repository
      - Open Access

  - name: QUT ESOE OpenID Connect Provider
    description: >-
      QUT's enterprise single sign-on authorization server, a Keycloak deployment on QUT's own
      address space. Publishes OpenID Connect Discovery 1.0 metadata, an RFC 8414 authorization
      server metadata document, a JWKS, and endpoints for dynamic client registration, PAR, CIBA,
      device authorization, introspection and revocation. Discovery is fully public; obtaining a
      client credential is not, and QUT documents no public route to one.
    x-operator: institution
    x-operator-basis: >-
      esoe.qut.edu.au resolves to 131.181.118.129 with no CNAME; APNIC netname QUT-AU, org
      ORG-QUOT1-AP, origin AS7575; TLS subject O=QUEENSLAND UNIVERSITY OF TECHNOLOGY,
      CN=esoe.qut.edu.au.
    humanURL: https://esoe.qut.edu.au/auth/realms/qut/.well-known/openid-configuration
    baseURL: https://esoe.qut.edu.au/auth/realms/qut
    properties:
      - type: OpenAPI
        url: openapi/qut-esoe-openid-connect-openapi.yml
      - type: JSONSchema
        url: json-schema/qut-esoe-openid-configuration-schema.json
      - type: Authentication
        url: authentication/qut-authentication.yml
      - type: Scopes
        url: scopes/qut-scopes.yml
      - type: WellKnown
        url: https://esoe.qut.edu.au/auth/realms/qut/.well-known/openid-configuration
    tags:
      - OpenID Connect
      - OAuth 2.0
      - Identity

  - name: QUT Shibboleth Identity Provider
    description: >-
      QUT's self-hosted Shibboleth SAML 2.0 identity provider. Publishes per-entity metadata that
      dereferences from its own entityID, asserts shibmd:Scope qut.edu.au, and is registered in the
      Australian Access Federation production aggregate with OrganizationDisplayName "Queensland
      University of Technology". Unlike most institution-branded IdPs in this cohort, it is not a
      managed AAF Rapid IdP — QUT runs it on its own network.
    x-operator: institution
    x-operator-basis: >-
      idp.qut.edu.au resolves to 131.181.196.172 with no CNAME on 8.8.8.8, 1.1.1.1 and 9.9.9.9;
      APNIC netname QUT-AU, origin AS7575; DigiCert OV certificate to
      O=QUEENSLAND UNIVERSITY OF TECHNOLOGY, CN=idp.qut.edu.au.
    humanURL: https://aaf.edu.au/
    baseURL: https://idp.qut.edu.au/idp/shibboleth
    properties:
      - type: IdentityFederation
        url: identity-federation/qut-identity-federation.yml
      - type: Metadata
        url: identity-federation/qut-idp-saml-metadata.xml
    tags:
      - SAML
      - Shibboleth
      - Identity Federation

  - name: QUT ePrints REST Interface
    description: >-
      The GNU EPrints REST dataset interface. The index is open and the payload is closed — /rest/,
      /rest/eprint/ and /rest/subject/ return 200 without credentials, while every individual record
      returns 401. Recorded with the 401s documented, because a contract that shows only the
      unreachable success overstates the footprint.
    x-operator: institution
    x-operator-basis: Same host and same evidence as the OAI-PMH surface — 131.181.196.14, APNIC QUT-AU, AS7575.
    humanURL: https://eprints.qut.edu.au/
    baseURL: https://eprints.qut.edu.au/rest
    properties:
      - type: OpenAPI
        url: openapi/qut-eprints-rest-openapi.yml
    tags:
      - Research Repository
      - Partially Gated

  - name: QUT eResearch Agent Plugin Marketplace
    description: >-
      A public agent plugin marketplace published by QUT eResearch, carrying one MCP server
      definition that wraps the QUT eResearch documentation site. Institution-authored and a rare
      find for a university. Its MCP target, docs.eres.qut.edu.au, resolves publicly to 172.30.92.51,
      an RFC 1918 private address, so a client outside QUT's network cannot reach it.
    x-operator: institution
    x-operator-basis: >-
      Repository owned by the eresearchqut GitHub organization, "eResearch Queensland University of
      Technology", whose declared homepage is https://www.qut.edu.au/research/office-of-eresearch.
      Manifests name the author "QUT eResearch". Judged by what it says about itself, not by GitHub
      being the host.
    humanURL: https://github.com/eresearchqut/eresearch-agent-plugins
    baseURL: https://github.com/eresearchqut/eresearch-agent-plugins
    properties:
      - type: MCP
        url: mcp/qut-eresearch-docs-mcp.yml
      - type: SourceCode
        url: https://github.com/eresearchqut/eresearch-agent-plugins
    tags:
      - MCP
      - Agent Tooling

  - name: QUT Library Discovery (Ex Libris Primo VE tenant)
    description: >-
      QUT's library discovery layer runs on Ex Libris Primo VE / Alma under view id 61QUT_INST:QUT.
      The collection and the configuration are QUT's; the platform and any API contract are
      Ex Libris's. QUT publishes no keys and no developer documentation for it. Recorded as a
      relationship; the vendor's contract is deliberately not saved here.
    x-operator: tenant
    x-operator-basis: Institution-specific view id on a generic vendor host shared by every Ex Libris customer.
    humanURL: https://qut.primo.exlibrisgroup.com/discovery/search?vid=61QUT_INST:QUT
    baseURL: https://qut.primo.exlibrisgroup.com/discovery/search?vid=61QUT_INST:QUT
    tags:
      - Library
      - Vendor Platform

  - name: QUT Canvas LMS (Instructure tenant)
    description: >-
      QUT's learning management system, an Instructure Canvas tenancy on a QUT hostname, front-ended
      by Microsoft Entra ID sign-in. Canvas is an LTI 1.3 platform and exposes Instructure's REST
      API, but that conformance and that contract belong to Instructure. QUT publishes no developer
      access to it.
    x-operator: tenant
    x-operator-basis: >-
      CNAME TENANCY, and the reason a hostname-only verdict gets this one wrong. canvas.qut.edu.au
      is under QUT's own registrable domain, so a host rule reads it as institution-operated — but
      it CNAMEs to qut-prod-vanity.instructure.com and terminates on 13.33.67.61 / 13.33.67.118
      (Amazon CloudFront). It returns 200 serving a Microsoft-copyright sign-in page. The LMS
      software, the APIs and the LTI 1.3 conformance are Instructure's; the vanity hostname and the
      student data are QUT's.
    humanURL: https://canvas.qut.edu.au/
    baseURL: https://canvas.qut.edu.au/
    tags:
      - Learning Management
      - Vendor Platform

  - name: QUT collection in ARDC Research Data Australia
    description: >-
      QUT contributes a named group to the Australian Research Data Commons national registry.
      A live query for group "Queensland University of Technology" returns 926 registry objects —
      484 collections, 397 parties, 35 activities and 10 services — across ARDC data sources 106 and
      107. The registry API is ARDC's; the collection within it is QUT's, which is exactly the
      tenancy this pipeline exists to record rather than delete.
    x-operator: tenant
    x-operator-basis: A named institutional scope on a shared national platform QUT does not operate.
    humanURL: https://researchdata.edu.au/
    baseURL: https://researchdata.edu.au/api/registry/records?group=Queensland%20University%20of%20Technology
    tags:
      - Research Data
      - National Infrastructure

  - name: DataCite DOI and RAiD registration
    description: >-
      QUT registers persistent identifiers with DataCite through the ARDC consortium. Two clients
      are evidenced: ARDCX.QUT1, a repository client registered 2020 holding 535 DOIs, and
      UUAG.IXKMSM, a RAiD registry client registered 2024 for QUT Research Infrastructure. This is a
      membership and a fact about QUT; DataCite's own API is not saved as QUT's contract and this
      entry is never to be deleted as a "shared host".
    x-operator: registry
    x-operator-basis: An identifier registry QUT is registered in, evidenced by client symbol.
    humanURL: https://api.datacite.org/clients/ardcx.qut1
    baseURL: https://api.datacite.org/clients/ardcx.qut1
    tags:
      - DataCite
      - Persistent Identifiers

  - name: Crossref membership
    description: >-
      QUT is a Crossref member, id 3230, primary-name "Queensland University of Technology",
