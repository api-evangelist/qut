  - name: Australian Access Federation membership
    description: >-
      QUT is a member of the Australian Access Federation, which is interfederated with eduGAIN.
      Five entity descriptors naming QUT appear in the production aggregate; three are QUT-operated
      (the IdP at idp.qut.edu.au and service providers esoe.qut.edu.au and webwork.qut.edu.au) and
      two belong to the QUT Guild and are operated by Membership Solutions Limited. A federation is
      shared by definition and the IdP behind it is QUT's — this entry is never to be deleted as a
      shared host.
    x-operator: federation
    x-operator-basis: >-
      National identity federation carrying QUT's own Shibboleth IdP metadata, with
      OrganizationDisplayName "Queensland University of Technology".
    humanURL: https://aaf.edu.au/
    baseURL: https://md.aaf.edu.au/aaf-metadata.xml
    properties:
      - type: IdentityFederation
        url: identity-federation/qut-identity-federation.yml
    tags:
      - Identity Federation
      - eduGAIN
      - SAML
