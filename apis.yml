aid: qut
name: Queensland University of Technology
x-type: university
x-category: Public Research University
description: >-
  Queensland University of Technology (QUT) is a public research university in Brisbane, Australia,
  serving around 50,000 students with an applied emphasis in teaching and research. It is not an
  API producer and it publishes no developer portal, no API keys and no OpenAPI of its own — but it
  is one of the few institutions in this cohort whose machine-readable surfaces are genuinely its
  own engineering rather than a vendor's contract running under its name. Three surfaces were
  verified live on QUT-owned infrastructure inside APNIC allocation QUT-AU (AS7575), with no CNAME
  to a managed platform: the QUT ePrints OAI-PMH 2.0 repository interface at eprints.qut.edu.au,
  fully public and advertising oai_dc, oai_bibl, oai_openaire and uketd_dc; a self-hosted Shibboleth
  SAML 2.0 identity provider at idp.qut.edu.au registered in the Australian Access Federation and
  asserting the qut.edu.au scope; and a Keycloak OpenID Connect authorization server at
  esoe.qut.edu.au publishing a complete discovery document, JWKS, RFC 8414 metadata, dynamic client
  registration, PAR, CIBA and certificate-bound tokens, brokering interactive login to Microsoft
  Entra ID. QUT eResearch additionally publishes a public agent plugin marketplace carrying an MCP
  server definition, which is rare for a university — though the documentation host it targets,
  docs.eres.qut.edu.au, resolves publicly to an RFC 1918 private address and is unreachable from
  outside QUT. Everything else is bought: library discovery is an Ex Libris Primo VE tenancy, the
  LMS is Instructure Canvas, research data is contributed to ARDC's national registry, and identity
  is registered in DataCite, Crossref and ROR. Those relationships are recorded here; their
  contracts are not, because they are not QUT's. There is no open data portal, no course or
  timetable API, and no public route to a credential for the one authorization server QUT does run.
