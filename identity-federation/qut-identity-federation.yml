description: >-
  QUT's identity federation surface is the strongest programmable footprint the institution has,
  and it is genuinely QUT's own — which is not the usual answer for this cohort.

  QUT self-hosts its Shibboleth Identity Provider. idp.qut.edu.au has NO CNAME, resolves to
  131.181.196.172 inside the APNIC allocation QUT-AU / ORG-QUOT1-AP (origin AS7575, "Queensland
  University of Technology"), and presents a DigiCert OV certificate whose subject is
  O=QUEENSLAND UNIVERSITY OF TECHNOLOGY, CN=idp.qut.edu.au. That is the opposite of the pattern
  found at Monash and Melbourne, where the institution-branded IdP CNAMEs to
  <hash>.idp-cname.aaf.edu.au and terminates on Amazon address space behind AAF's managed Rapid
  IdP. QUT runs its own metal, so the SAML conformance here is QUT's engineering, not a vendor's.

  QUT additionally runs a second, separate identity service on its own address space: ESOE at
  esoe.qut.edu.au, a Keycloak deployment that is simultaneously an OpenID Connect provider (full
  discovery document, JWKS, RFC 8414 metadata, dynamic client registration, PAR, CIBA, device code,
  certificate-bound tokens) and a SAML 2.0 IdP for the realm `qut`, brokering the interactive login
  step to Microsoft Entra ID. Two independent, live, machine-readable identity contracts on
  QUT-owned infrastructure.

  Five entity descriptors naming QUT appear in the AAF aggregate. Three are QUT's own
  (OrganizationDisplayName "Queensland University of Technology"); two belong to the QUT Guild, the
  student union, whose SPs are operated by Membership Solutions Limited and are therefore a
  third party's, not the institution's. One QUT-owned SP, webwork.qut.edu.au, is registered in the
  federation but no longer resolves in public DNS — a stale federation registration, recorded here
  because it is a fact about the federation entry rather than a fact we should quietly drop.

