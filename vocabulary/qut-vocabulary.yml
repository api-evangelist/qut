# This file was generated by API Evangelist for the qut profile on 2026-09-01. It was NOT published
# by Queensland University of Technology. The `method:` key states how the content was obtained and
# `source:` names the live URLs it was read from.
specification: API Evangelist Vocabulary
specificationVersion: '0.1'
provider: Queensland University of Technology
providerId: qut
generated: '2026-09-01'
method: derived
source: >-
  Terms extracted from the live surfaces QUT operates: the OAI-PMH Identify, ListMetadataFormats
  and ListSets responses at https://eprints.qut.edu.au/cgi/oai2; the OpenID Provider Metadata at
  https://esoe.qut.edu.au/auth/realms/qut/.well-known/openid-configuration; the SAML 2.0
  EntityDescriptor at https://idp.qut.edu.au/idp/shibboleth; and the AAF production aggregate at
  https://md.aaf.edu.au/aaf-metadata.xml. Every term below appears verbatim in one of those.
description: >-
  The vocabulary QUT actually exposes on its machine surfaces. It is protocol vocabulary, not
  institutional business vocabulary — QUT publishes no domain API, so there is no course, unit,
  enrolment or facility vocabulary to record. What is here is real and small, and saying so is the
  point.
terms:
  - term: QUT ePrints
    type: system
    definition: QUT's institutional research repository, GNU EPrints software self-hosted on QUT infrastructure.
    source: 'OAI-PMH Identify/repositoryName'
  - term: eprints.qut.edu.au
    type: identifier-namespace
    definition: The OAI repositoryIdentifier under which every QUT ePrints record identifier is minted, as oai:eprints.qut.edu.au:{id}.
    source: 'OAI-PMH Identify/description/oai-identifier/repositoryIdentifier'
  - term: oai_dc
    type: metadata-format
    definition: Dublin Core, the OAI-PMH mandatory format.
    source: 'OAI-PMH ListMetadataFormats'
  - term: oai_openaire
    type: metadata-format
    definition: The OpenAIRE Guidelines profile, exposing QUT output to the European open-science aggregation network.
    source: 'OAI-PMH ListMetadataFormats'
  - term: uketd_dc
    type: metadata-format
    definition: UK Electronic Theses and Dissertations Dublin Core profile, used for QUT higher-degree theses.
    source: 'OAI-PMH ListMetadataFormats'
  - term: oai_bibl
    type: metadata-format
    definition: An EPrints bibliographic metadata profile.
    source: 'OAI-PMH ListMetadataFormats'
  - term: hex-encoded setSpec
    type: convention
    definition: >-
      QUT ePrints encodes each OAI set as the hexadecimal representation of the underlying EPrints
      filter expression. 74797065733D61727469636C65 decodes to `types=article`;
      7374617475733D707562 decodes to `status=pub`. A harvester cannot read QUT's set list without
      hex-decoding it first.
    source: 'OAI-PMH ListSets'
  - term: ESOE
    type: system
    definition: >-
      QUT's enterprise single sign-on service at esoe.qut.edu.au. A Keycloak deployment acting as
      both an OpenID Connect provider and a SAML 2.0 identity provider for the realm `qut`, brokering
      the interactive login to Microsoft Entra ID.
    source: 'AAF EntityDescriptor mdui:DisplayName "QUT ESOE"; Keycloak realm path /auth/realms/qut'
  - term: 'realm: qut'
    type: identifier
    definition: The Keycloak realm name, and the issuer path segment of every token QUT ESOE mints.
    source: 'openid-configuration issuer = https://esoe.qut.edu.au/auth/realms/qut'
  - term: Service_Account
    type: scope
    definition: A QUT-defined OAuth client scope, advertised publicly and undocumented publicly.
    source: 'openid-configuration scopes_supported'
  - term: service_account
    type: scope
    definition: A second QUT-defined client scope, a lowercase variant of the above, advertised simultaneously.
    source: 'openid-configuration scopes_supported'
  - term: Integsvc_test_client
    type: scope
    definition: A QUT-defined client scope apparently belonging to an integration-services test client.
    source: 'openid-configuration scopes_supported'
  - term: qut.edu.au
    type: federation-scope
    definition: >-
      The shibmd:Scope asserted by QUT's Shibboleth IdP — the attribute namespace QUT is authorised
      to assert within the Australian Access Federation.
    source: 'SAML metadata Extensions/shibmd:Scope'
  - term: Australian Access Federation
    type: federation
    definition: The national identity federation QUT's IdP and service providers are registered in, interfederated with eduGAIN.
    source: 'https://md.aaf.edu.au/aaf-metadata.xml'
  - term: ARDCX.QUT1
    type: registry-identifier
    definition: QUT's DataCite repository client symbol, under the ARDC consortium, registered 2020, 535 DOIs.
    source: 'https://api.datacite.org/clients/ardcx.qut1'
  - term: UUAG.IXKMSM
    type: registry-identifier
    definition: QUT Research Infrastructure's DataCite RAiD registry client, registered 2024.
    source: 'https://api.datacite.org/clients/uuag.ixkmsm'
  - term: '3230'
    type: registry-identifier
    definition: QUT's Crossref member id.
    source: 'https://api.crossref.org/members/3230'
  - term: 'https://ror.org/03pnv4752'
    type: registry-identifier
    definition: QUT's Research Organization Registry identifier.
    source: 'https://api.ror.org/v2/organizations/03pnv4752'
not_present:
  - course_catalog_vocabulary
  - unit_or_subject_vocabulary
  - enrolment_vocabulary
  - facility_or_room_vocabulary
  - transport_or_campus_life_vocabulary
