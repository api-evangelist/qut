specification: API Evangelist MCP
specificationVersion: '0.1'
provider: Queensland University of Technology
providerId: qut
generated: '2026-09-01'
method: searched
source: >-
  https://github.com/eresearchqut/eresearch-agent-plugins — repository metadata and file tree read
  from api.github.com, and the manifests fetched raw from
  raw.githubusercontent.com/eresearchqut/eresearch-agent-plugins/main/ on 2026-09-01:
  .claude-plugin/marketplace.json, plugins/docs/plugin.json, plugins/docs/.mcp.json and AGENTS.md.
description: >-
  QUT eResearch publishes a public agent plugin marketplace carrying one MCP server definition.
  This is a genuine, institution-authored agent surface and it is rare in the university cohort —
  most institutions in this catalog publish nothing addressed to agents at all.

  It is also, as deployed, not reachable. The MCP server is a stdio wrapper (`npx -y myst-mcp`)
  around QUT's eResearch documentation site at https://docs.eres.qut.edu.au, and that hostname
  resolves publicly to 172.30.92.51 — an address inside RFC 1918 private space 172.16.0.0/12.
  Every public resolver tested (8.8.8.8, 1.1.1.1, 9.9.9.9) returns the same private address, and a
  connection attempt fails. So a member of the public can install the plugin and it cannot reach
  its documentation source; only a client already inside QUT's network can.

  Recorded exactly that way. The publication is real and to QUT's credit; the reachability is not,
  and inflating it would be the same error this pipeline exists to prevent.

servers:
  - name: eresearch-docs
    x-operator: institution
    transport: stdio
    command: npx
    args:
      - '-y'
      - myst-mcp
      - https://docs.eres.qut.edu.au
      - eResearch QUT documentation website
    upstream_documentation_site: https://docs.eres.qut.edu.au
    implementation:
      package: myst-mcp
      registry: npm
      x-operator: vendor
      note: >-
        myst-mcp is a third-party npm package, not QUT code. QUT authored the plugin manifest and
        the configuration; the MCP server implementation is someone else's.
    deployment:
      type: local-stdio
      hosted_endpoint: none
      transport_url: null
      reachable_from_public_internet: false
      probed: '2026-09-01'
      evidence:
        - check: dns
          host: docs.eres.qut.edu.au
          resolvers: ['8.8.8.8', '1.1.1.1', '9.9.9.9']
          answer: 172.30.92.51
          classification: RFC 1918 private address (172.16.0.0/12)
        - check: http
          url: https://docs.eres.qut.edu.au/
          status: 0
          detail: Connection could not be established from a public network.
        - check: dns
          host: eres.qut.edu.au
          answer: NXDOMAIN
      note: >-
        QUT publishes a public DNS record pointing at a private address. This is an internal-only
        documentation host with an externally visible name.

marketplace:
